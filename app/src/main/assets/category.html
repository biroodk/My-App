<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Folder Locker</title><style>
body{background:blue;color:#fff;margin:0;font-family:'Segoe UI',sans-serif}section{overflow:hidden;width:98%;height:99%;border:2px solid #0ff;position:fixed;top:0;left:1px;border-radius:20px;background:#020a1e;box-shadow:0 0 30px #0ff,0 0 30px #00f;display:flex;flex-direction:column}header{background:#000040;border-bottom:1px solid rgba(0,255,255,.2);z-index:10}.top-row{display:flex;align-items:center;gap:10px;padding:10px}.app-icon,.icon-btn{width:40px;height:40px;min-width:40px;border-radius:10px;background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}.top-title{flex:1;min-width:0}.top-title div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;gap:10px}.search-box{display:none;width:90%;margin:5px auto;padding:8px;border:1px solid #0ff;border-radius:12px;background:#000;color:#fff}.search-box.show{display:flex}.search-box input{flex:1;background:transparent;border:0;outline:0;color:#fff}main{flex:1;overflow:auto;padding:8px 8px 100px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;border:1px solid rgba(0,255,255,.25);border-radius:14px;overflow:hidden;background:rgba(0,0,40,.7);min-height:180px;cursor:pointer}.card-preview{width:100%;height:145px;display:block;object-fit:contain;background:#000}video.card-preview{object-fit:cover}.card-info{padding:8px;display:flex;flex-direction:column;gap:4px}.card-info b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-info span{font-size:9px;color:#8aa0c8}.card-menu-btn{position:absolute;right:7px;top:7px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid #0ff;display:flex;align-items:center;justify-content:center;z-index:3}.card-menu{position:absolute;right:7px;top:44px;width:205px;background:#000040;border:1px solid #0ff;border-radius:14px;z-index:20;display:none;box-shadow:0 0 20px #0ff;overflow:hidden}.card-menu.show{display:block}.card-menu div{padding:12px;border-bottom:1px solid rgba(0,255,255,.1);font-size:12px}.empty{margin:30px auto;padding:30px;text-align:center;border:1px solid rgba(0,255,255,.25);border-radius:18px;color:#8aa0c8}.fab{position:fixed;right:5%;bottom:7%;width:52px;height:52px;border-radius:50%;background:linear-gradient(90deg,#0ff,#0a8cff);color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:50;box-shadow:0 0 20px #0ff}footer{position:fixed;bottom:.6%;width:92.5%;height:52px;background:#000040;border-top:1px solid rgba(0,255,255,.2);border-radius:20px;display:flex;justify-content:space-around;align-items:center;z-index:30}footer a{color:#8aa0c8;text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center}footer a.active{color:#0ff}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.overlay.show{display:flex}.box{width:320px;background:#000040;border:2px solid #0ff;border-radius:18px;padding:18px;box-shadow:0 0 30px #0ff}.btn{width:100%;height:44px;background:linear-gradient(90deg,#0ff,#0a8cff);border:0;border-radius:12px;font-weight:800;margin-top:8px}.btn.gray{background:rgba(255,255,255,.1);color:#aaa}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 16px;border:1px solid #0ff;border-radius:12px;background:rgba(0,255,255,.12);color:#0ff;font-weight:700;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}.toast.err{border-color:#ff4444;color:#ff8a8a;background:rgba(255,60,60,.15)}.viewer{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}.viewer.show{display:flex}.viewer-head{display:flex;align-items:center;gap:10px;padding:10px;background:#000040;border-bottom:1px solid #0ff}.viewer-main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;position:relative}.viewer-main img{max-width:none;max-height:none;transform-origin:center;user-select:none}.viewer-main video{max-width:100%;max-height:82vh}.viewer-controls{display:flex;gap:8px;padding:8px;background:#000040;justify-content:center}.viewer-controls button{border:1px solid #0ff;background:rgba(0,255,255,.1);color:#fff;border-radius:10px;padding:8px 12px}.openwith{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;z-index:300}.openwith.show{display:flex}.sheet{width:100%;background:#000040;border:1px solid #0ff;border-radius:20px 20px 0 0;padding-bottom:20px}.sheet div{padding:15px;border-bottom:1px solid rgba(0,255,255,.1)}

/* Consistent neon styling for category menus and folder chooser */
.box #menuItems > div,
.box .item {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 24px;
    margin-top: 7px;
    padding: 12px 14px;
    border: 1px solid rgba(0,255,255,.22);
    border-radius: 11px;
    background: linear-gradient(110deg,rgba(0,255,255,.09),rgba(10,140,255,.08));
    color: #e7f8ff;
    font-size: 13px;
    cursor: pointer;
    box-sizing: border-box;
}
.box #menuItems > div:active,
.box .item:active {
    background: rgba(0,255,255,.22);
    border-color: #0ff;
    transform: scale(.99);
}
.box #menuItems > div[style*="ff8a8a"],
.box .item[style*="ff8a8a"] {
    border-color: rgba(255,80,100,.45);
    background: rgba(255,50,80,.10);
    color: #ff8a8a;
}

</style></head><body><section><header><div class="top-row"><div class="app-icon" onclick="location.href='files.html'"><img src="icon.png" width="40" height="40" style="border-radius:8px"></div><div class="top-title"><div style="font-weight:800" id="title">Folder Locker</div><div style="font-size:10px;color:#8aa0c8" id="sub">Private Vault</div></div><div class="top-actions"><div class="icon-btn" onclick="toggleSearch()">🔍</div><div class="icon-btn" onclick="toggleMainMenu()">⋮</div></div></div><div class="search-box" id="searchBox"><span>🔍</span><input id="search" placeholder="Search..."><span onclick="toggleSearch()">✖️</span></div></header><main><div class="grid" id="grid"></div></main><div class="fab" onclick="AndroidVault.pickFilesForCategory(CATEGORY)">+</div><footer><a href="index.html">🏠<span>Home</span></a><a href="files.html">📁<span>Files</span></a><a href="settings.html">⚙️<span>Settings</span></a></footer></section><div class="overlay" id="menuOverlay"><div class="box"><b style="color:#0ff">Menu</b><div id="menuItems"></div><button class="btn gray" onclick="menuOverlay.classList.remove('show')">Close</button></div></div><div class="overlay" id="popup"><div class="box" style="text-align:center"><div id="pIcon" style="font-size:40px">🔒</div><b id="pTitle" style="color:#0ff">Title</b><p id="pMsg" style="color:#c0d0f0;font-size:13px"></p><input id="pInput" style="display:none;width:90%;padding:10px;background:#000;color:#fff;border:1px solid #0ff;border-radius:10px"><div style="display:flex;gap:8px"><button id="pCancel" class="btn gray" onclick="closePopup(false)">Cancel</button><button class="btn" onclick="closePopup(true)">OK</button></div></div></div><div class="viewer" id="viewer"><div class="viewer-head"><button onclick="closeViewer()">✕</button><div style="flex:1"><b id="vName"></b><div id="vMeta" style="font-size:10px;color:#8aa0c8"></div></div><button onclick="showFileMenu(viewerIndex)">⋮</button></div><div class="viewer-main" id="viewerMain"></div><div class="viewer-controls"><button onclick="zoomBy(-.25)">−</button><button onclick="zoomBy(.25)">＋</button><button onclick="resetZoom()">Reset</button><button onclick="viewerMove(-1)">‹</button><button onclick="viewerMove(1)">›</button></div></div><div class="openwith" id="openwith"><div class="sheet"><div style="color:#0ff;font-weight:800">Open with <span style="float:right" onclick="openwith.classList.remove('show')">✕</span></div><div onclick="openWithAndroid()">📱 Android app chooser</div><div onclick="openWithAndroid()">📄 WPS Office / Microsoft Office / compatible app</div></div></div><div id="toast" class="toast"></div><script src="vault.js"></script><script>
const CATEGORY='images',cfg=CATEGORY_RULES[CATEGORY];let current=[],menuFile=-1,viewerIndex=0,zoom=1;requireUnlock();title.textContent=cfg.label+' - Folder Locker';sub.textContent='All '+cfg.label.toLowerCase()+' from the Folder Locker vault';
function toastMsg(m,e=false){toast.textContent=m;toast.className='toast show'+(e?' err':'');setTimeout(()=>toast.className='toast',2500)}function toggleSearch(){searchBox.classList.toggle('show');if(searchBox.classList.contains('show'))search.focus()}function toggleMainMenu(){menuItems.innerHTML='<div onclick="AndroidVault.pickFilesForCategory(CATEGORY)">📤 Add '+cfg.label+'</div><div onclick="sortNow(&quot;name&quot;)">🔤 Sort by name</div><div onclick="sortNow(&quot;size&quot;)">📦 Sort by size</div><div onclick="sortNow(&quot;time&quot;)">⏰ Sort by time</div><div onclick="shareAll()">🔗 Share selected/all</div><div onclick="exportAll()">📤 Export selected/all</div>';menuOverlay.classList.add('show')}
function showPopup(i,t,m,input=false,def='',confirm=false){return new Promise(r=>{pIcon.textContent=i;pTitle.textContent=t;pMsg.textContent=m;pInput.style.display=input?'block':'none';pInput.value=def;pCancel.style.display=confirm?'block':'none';popup.classList.add('show');window._resolve=r})}function closePopup(v){popup.classList.remove('show');if(window._resolve){let r=window._resolve;window._resolve=null;r(v)}}
function load(){current=listVault(CATEGORY);filterNow();}function filterNow(){let q=(search.value||'').toLowerCase();current=current.filter(f=>!q||f.name.toLowerCase().includes(q));render()}search.oninput=filterNow;
function render(){grid.innerHTML='';if(!current.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div style="font-size:50px">'+cfg.icon+'</div><b>No '+cfg.label.toLowerCase()+' yet</b><br><span>Use + to upload. Files remain inside Folder Locker until exported.</span></div>';return}current.forEach((f,i)=>{let m=f.mime||mimeFor(f.name),visual=m.startsWith('image/')?'<img class="card-preview" src="'+fileUrl(f)+'">':m.startsWith('video/')?'<video class="card-preview" src="'+fileUrl(f)+'" muted playsinline preload="metadata"></video>':m.startsWith('audio/')?'<div class="card-preview" style="display:flex;align-items:center;justify-content:center;font-size:55px">🎵</div>':'<div class="card-preview" style="display:flex;align-items:center;justify-content:center;font-size:55px">📄</div>';let c=document.createElement('div');c.className='card';c.innerHTML=visual+'<div class="card-menu-btn" onclick="event.stopPropagation();showFileMenu('+i+')">⋮</div><div class="card-info"><b>'+escapeHtml(f.name)+'</b><span>'+formatSize(f.size)+' • '+new Date(f.time).toLocaleString()+'</span></div>';c.onclick=e=>{if(!e.target.closest('.card-menu-btn'))openViewer(i)};grid.appendChild(c)})}
function showFileMenu(i){menuFile=i;const f=current[i];menuItems.innerHTML='<div onclick="renameCurrent()">✏️ Rename</div><div onclick="copyCurrent()">📋 Copy</div><div onclick="moveCurrent()">📁 Move</div><div onclick="shareCurrent()">🔗 Share</div><div onclick="openWithCurrent()">📂 Open with...</div><div onclick="exportCurrent()">📤 Export / choose location</div><div onclick="removeCurrent()" style="color:#ff8a8a">↩️ Remove from Folder Locker</div><div onclick="deleteCurrent()" style="color:#ff8a8a">🗑️ Delete permanently</div>';menuOverlay.classList.add('show')}
async function renameCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');const n=await showPopup('✏️','Rename','Enter new name',true,f.name,true);if(n&&AndroidVault.renameFile(f.path,n)){toastMsg('Renamed');load()}else if(n)toastMsg('Rename failed',true)}
function chooseFolder(cb){let all=listTree().filter(x=>x.type==='folder');let box='<div style="color:#0ff;font-weight:800;padding:12px">Choose folder</div><div onclick="window._pickFolder(\"\")">📁 Folder Locker (root)</div>'+all.map(x=>'<div onclick="window._pickFolder('+JSON.stringify(x.path)+')">📁 '+escapeHtml(x.path)+'</div>').join('');menuItems.innerHTML=box;window._pickFolder=p=>{menuOverlay.classList.remove('show');cb(p)};menuOverlay.classList.add('show')}
function copyCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');chooseFolder(t=>{if(AndroidVault.copyFile(f.path,t)){toastMsg('Copied');load()}else toastMsg('Copy failed',true)})}function moveCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');chooseFolder(t=>{if(AndroidVault.moveFile(f.path,t)){toastMsg('Moved');load()}else toastMsg('Move failed',true)})}function shareCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');if(!AndroidVault.shareFile(f.path))toastMsg('Share failed',true)}function exportCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');AndroidVault.exportFile(f.path)}function removeCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');AndroidVault.removeToDownloads(f.path)}async function deleteCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');if(await showPopup('🗑️','Delete permanently?','Delete '+f.name+' from Folder Locker?',false,'',true)){AndroidVault.deleteFile(f.path);load();toastMsg('Deleted',true)}}
function openViewer(i){viewerIndex=i;zoom=1;viewer.classList.add('show');showViewer()}function showViewer(){const f=current[viewerIndex];if(!f)return;vName.textContent=f.name;vMeta.textContent=(viewerIndex+1)+' / '+current.length+' • '+formatSize(f.size);let m=f.mime||mimeFor(f.name);viewerMain.innerHTML=m.startsWith('image/')?'<img id="zoomImage" src="'+fileUrl(f)+'">':m.startsWith('video/')?'<video src="'+fileUrl(f)+'" controls autoplay playsinline></video>':m.startsWith('audio/')?'<audio src="'+fileUrl(f)+'" controls autoplay style="width:90%"></audio>':'<div style="text-align:center;color:#8aa0c8">This document needs Open with.</div>'}function closeViewer(){viewer.classList.remove('show')}function viewerMove(d){viewerIndex=Math.max(0,Math.min(current.length-1,viewerIndex+d));zoom=1;showViewer()}function zoomBy(d){let im=document.getElementById('zoomImage');if(!im)return;zoom=Math.max(.25,Math.min(10,zoom+d));im.style.transform='scale('+zoom+')'}function resetZoom(){zoom=1;let im=document.getElementById('zoomImage');if(im)im.style.transform='scale(1)'}
let touchX=0;viewerMain.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});viewerMain.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)viewerMove(dx<0?1:-1)},{passive:true});
function openWithCurrent(){const f=current[menuFile];menuOverlay.classList.remove('show');window._openFile=f;openwith.classList.add('show')}function openWithAndroid(){if(window._openFile)AndroidVault.shareFile(window._openFile.path);openwith.classList.remove('show')}function sortNow(t){if(t==='name')current.sort((a,b)=>a.name.localeCompare(b.name));else if(t==='size')current.sort((a,b)=>(b.size||0)-(a.size||0));else current.sort((a,b)=>(b.time||0)-(a.time||0));menuOverlay.classList.remove('show');render()}function shareAll(){menuOverlay.classList.remove('show');let p=current.map(x=>x.path);if(p.length)AndroidVault.shareFiles(JSON.stringify(p))}function exportAll(){menuOverlay.classList.remove('show');let p=current.map(x=>x.path);if(p.length)AndroidVault.exportFiles(JSON.stringify(p))}
window.onNativeFilesImported=(c,n,r,f)=>{if(n){load();toastMsg(n+' file(s) added');if(f)toastMsg(f+' source file(s) could not be removed','err')}};window.onNativeExportDone=(n,t)=>{load();toastMsg(n+' of '+t+' exported')};function handleAndroidBack(){if(viewer.classList.contains('show')){closeViewer();return true}if(openwith.classList.contains('show')){openwith.classList.remove('show');return true}if(menuOverlay.classList.contains('show')){menuOverlay.classList.remove('show');return true}return false}
load();
</script></body></html>
