plugins { id 'com.android.application' }

// GitHub Actions assigns a monotonically increasing run number so newer APKs
// can be installed as updates instead of being rejected as the same version.
def folderLockerBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.securevault.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.securevault.app'
        minSdk 23
        targetSdk 35
        versionCode folderLockerBuildNumber
        versionName "1.0.${folderLockerBuildNumber}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'androidx.core:core:1.15.0'
}
